<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>讃美歌スコアプレイヤー</title><link rel="stylesheet" href="style.css"><body><header><span>HYMN · SCORE LAB</span><h1>楽譜を、音に。</h1><p>画像やPDFを読み込み、音符を確認して再生します。処理はこのブラウザ内で行います。</p></header><main><section class="controls"><label class="upload">楽譜を選ぶ<input id="file" type="file" accept="image/*,application/pdf"></label><label>PDFページ <input id="page" type="number" min="1" value="1"></label><button id="loadPage" disabled>ページを表示</button><button id="detect" disabled>五線・音符を解析</button><button id="demo">操作デモ</button><label>調号 <select id="key"><option value="0">なし</option><option value="-1">♭1（ヘ長調）</option><option value="-2">♭2</option><option value="1">♯1</option></select></label><label>テンポ <input id="tempo" type="number" min="30" max="240" value="80"></label><button id="play" disabled>▶ 再生</button><button id="stop">停止</button><button id="export" disabled>MIDI保存</button></section><p id="status" role="status">鮮明な印刷譜を選んでください。PDF表示ライブラリのみCDNから読み込みます。</p><div class="workspace"><section class="sheet"><h2>楽譜と検出位置</h2><p>解析後、五線上をクリックすると音を追加できます。</p><canvas id="canvas" width="900" height="480"></canvas></section><section class="editor"><h2>認識結果の確認</h2><p class="notice">試作版：塗りつぶされた音符を主に検出します。白い音符、連桁、付点、臨時記号、声部・拍位置の自動認識は未対応です。長さと開始拍は必ず確認してください。</p><p id="count">0音</p><div id="notes"></div></section></div></main><script type="module" src="app.js"></script></body></html>
